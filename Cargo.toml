[package]
name = "taskflow"
authors = ["Dmitriy303"]
description = "TaskFlow - DDD Rust backend for Dioxus migration"
edition = "2021"
license = "MIT"
repository = "https://github.com/TechCraft-Solutions/TaskFlow"
version = "0.1.0"

[lib]
name = "taskflow_lib"
path = "src/lib.rs"

[[bin]]
name = "taskflow"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# nosql_orm for database operations
nosql_orm = { git = "https://github.com/rusnakdima/nosql_orm", rev = "756a681f151a6388413cf6b5d66f4476d26e8321", features = ["json", "mongo", "query_cache", "validators"] }

# Dioxus
dioxus = { version = "0.8.0-alpha.1", features = ["desktop", "router"] }

# dioxus-shared for BaseCrudService and Response types
dioxus-shared = { path = "../dioxus-shared", features = ["dioxus-ui"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# UUID generation
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
